name: ReSukiSU for OnePlus 8T
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/resukisu.yml'
      - 'resukisu/**'
permissions:
  contents: read
concurrency:
  group: resukisu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-22.04
    outputs:
      prefix: ${{ steps.names.outputs.prefix }}
      build_date: ${{ steps.names.outputs.build_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Test official build selection guards
        run: python3 resukisu/test_official_manager.py
      - id: names
        name: Resolve and verify latest official main-branch manager
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 resukisu/fetch_official_manager.py --latest
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-resukisu-inputs
          path: resolved-inputs/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.prefix }}_official-manager-APK
          path: manager-output/
          if-no-files-found: error
  kernel:
    needs: metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: resolved-resukisu-inputs
          path: resukisu
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install kernel toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential flex bison bc libssl-dev libelf-dev python3 cpio rsync binutils-aarch64-linux-gnu ccache
          sdkmanager 'ndk;21.4.7075529'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: kernel-ccache-${{ hashFiles('resukisu/sources.json') }}-${{ github.run_id }}
          restore-keys: kernel-ccache-${{ hashFiles('resukisu/sources.json') }}-
      - name: Test kebab fixes and build official 4.19 kernel with ReSukiSU
        run: bash resukisu/build_kernel.sh
      - name: Verify OEM module certificate and vendor ABI
        run: python3 resukisu/verify_vendor_compatibility.py kernel-output/Image kernel-output/Module.symvers --report build/vendor-compatibility.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/ccache
          key: kernel-ccache-${{ hashFiles('resukisu/sources.json') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-build-logs
          path: |
            build/*.log
            build/vendor-compatibility.json
            build/kebab-regression.json
            build/kebab-compile.json
            build/out/.config
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: kernel-output/
          if-no-files-found: error
  package:
    needs: [metadata, kernel]
    env:
      RESUKISU_BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: resolved-resukisu-inputs
          path: resukisu
      - uses: actions/download-artifact@v4
        with:
          name: kernel
          path: kernel-output
      - name: Repack ReSukiSU boot once and create TWRP ZIP
        run: python3 resukisu/package.py
      - name: Test installer guards without accessing devices
        run: python3 resukisu/test_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.prefix }}_kebab_boot-img
          path: dist/*_kebab_boot.img
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.metadata.outputs.prefix }}_kebab_TWRP
          path: |
            dist/*_kebab_TWRP.zip
            dist/*.json
            dist/*.txt
            dist/*.md
          if-no-files-found: error
