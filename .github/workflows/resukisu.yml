name: Scoped lock hint compatibility candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Check framework scope state machine
        run: |
          mkdir -p build/host-tests
          javac --release 8 -d build/host-tests resukisu/lock-hint/Port8tLockHint.java resukisu/lock-hint/Port8tLockHintTest.java
          java -cp build/host-tests com.oplus.uifirst.Port8tLockHintTest
      - name: Install pinned kernel toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential flex bison bc libssl-dev libelf-dev python3 cpio rsync binutils-aarch64-linux-gnu ccache
          sdkmanager 'ndk;21.4.7075529'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: kernel-ccache-${{ hashFiles('resukisu/sources.json') }}-${{ github.run_id }}
          restore-keys: kernel-ccache-${{ hashFiles('resukisu/sources.json') }}-
      - name: Build candidate with existing device fixes
        run: |
          bash resukisu/build_kernel.sh
          grep -qx 'CONFIG_OPLUS_LOCK_HINT_COMPAT=y' kernel-output/kernel.config
          aarch64-linux-gnu-nm build/out/vmlinux > build/symbols.txt
          grep ' lock_hint_write$' build/symbols.txt
          grep ' lock_hint_read$' build/symbols.txt
      - name: Verify OEM module certificate and vendor ABI
        run: python3 resukisu/verify_vendor_compatibility.py kernel-output/Image kernel-output/Module.symvers --report build/vendor-compatibility.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev88-build-logs
          path: |
            build/*.log
            build/*.json
            build/out/.config
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: dev88-kernel
          path: kernel-output/
          if-no-files-found: error

