name: Stage ReSukiSU release assets
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful ReSukiSU build run ID
        required: true
      release_tag:
        description: Existing draft release tag targeting that build commit
        required: true
permissions:
  actions: read
  contents: write
jobs:
  upload:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - id: source
        name: Verify successful source build and draft target
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          def api(path): return json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/'+path]))
          run=api('actions/runs/'+str(int(os.environ['BUILD_RUN'])))
          assert run['name']=='ReSukiSU for OnePlus 8T' and run['head_branch']=='ReSukiSU-ColorOS16'
          assert run['conclusion']=='success' and run['status']=='completed'
          assert run['head_repository']['full_name']==os.environ['GH_REPO']
          releases=api('releases?per_page=100')
          release=next(r for r in releases if r['tag_name']==os.environ['RELEASE_TAG'])
          assert release['draft'] and release['target_commitish']==run['head_sha']
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('sha='+run['head_sha']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Verify both ROM packages and upload five finished assets to draft
        run: python3 resukisu/publish_dual_release.py artifacts
